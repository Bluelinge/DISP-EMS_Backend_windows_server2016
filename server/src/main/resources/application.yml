server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: never
spring:
  application:
    name: disp-ems-server
  datasource:
    url: ${DISP_DB_URL:jdbc:mysql://127.0.0.1:3306/disp_ems?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC}
    username: ${DISP_DB_USERNAME:disp_ems}
    password: ${DISP_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: ${DISP_REDIS_HOST:127.0.0.1}
    port: ${DISP_REDIS_PORT:6379}
    password: ${DISP_REDIS_PASSWORD:}
    timeout: 3000ms
  servlet:
    multipart:
      max-file-size: ${DISP_MAX_FILE_SIZE:2GB}
      max-request-size: ${DISP_MAX_REQUEST_SIZE:2GB}
  flyway:
    enabled: true
    baseline-on-migrate: true
    encoding: UTF-8
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
disp:
  security:
    session-hours: ${DISP_SESSION_HOURS:8}
  storage:
    endpoint: ${DISP_MINIO_ENDPOINT:http://127.0.0.1:9000}
    public-endpoint: ${DISP_MINIO_PUBLIC_ENDPOINT:${DISP_MINIO_ENDPOINT:http://127.0.0.1:9000}}
    access-key: ${DISP_MINIO_ACCESS_KEY:}
    secret-key: ${DISP_MINIO_SECRET_KEY:}
    bucket: ${DISP_MINIO_BUCKET:disp-ems}
    url-expiry-minutes: ${DISP_FILE_URL_EXPIRY_MINUTES:15}
    ffprobe-path: ${DISP_FFPROBE_PATH:ffprobe}
  bootstrap:
    admin-no: ${DISP_BOOTSTRAP_ADMIN_NO:ADMIN-001}
    admin-name: ${DISP_BOOTSTRAP_ADMIN_NAME:系统管理员}
    admin-password: ${DISP_BOOTSTRAP_ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${DISP_CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:8089,http://localhost:8089}
