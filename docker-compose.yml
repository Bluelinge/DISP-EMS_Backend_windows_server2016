services:
  mysql:
    image: mysql:5.7.44
    container_name: disp-ems-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_bin
    env_file: deploy/.env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.2-alpine
    container_name: disp-ems-redis
    restart: unless-stopped
    env_file: deploy/.env
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: soldevelo/minio:2025.7.23
    container_name: disp-ems-minio
    restart: unless-stopped
    env_file: deploy/.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET}
      MINIO_CONSOLE_ADDRESS: ":9001"
      TZ: Asia/Shanghai
    volumes:
      - minio_data:/bitnami/minio/data
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"

  server:
    image: disp-ems-server:local
    build:
      context: ./server
    container_name: disp-ems-server
    restart: unless-stopped
    env_file: deploy/.env
    environment:
      DISP_DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC
      DISP_DB_USERNAME: ${MYSQL_USER}
      DISP_DB_PASSWORD: ${MYSQL_PASSWORD}
      DISP_REDIS_HOST: redis
      DISP_REDIS_PORT: 6379
      DISP_REDIS_PASSWORD: ${REDIS_PASSWORD}
      DISP_MINIO_ENDPOINT: http://minio:9000
      DISP_MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      DISP_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      DISP_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      DISP_MINIO_BUCKET: ${MINIO_BUCKET}
      DISP_BOOTSTRAP_ADMIN_NO: ${BOOTSTRAP_ADMIN_NO}
      DISP_BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME}
      DISP_BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      DISP_CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep UP"]
      interval: 15s
      timeout: 5s
      retries: 20

  web:
    image: disp-ems-web:local
    build:
      context: .
      args:
        VITE_USE_MOCK: "false"
        VITE_API_BASE_URL: /api/v1
    container_name: disp-ems-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_PORT}:80"

volumes:
  mysql_data:
  redis_data:
  minio_data:
